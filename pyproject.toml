[project]
name = "mina"
version = "0.0.1"
description = "Mel Inter-phoneme Neural Alignment"
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.11.0",
    "torch>=2.11.0",
    "numpy>=2.4.4",
    "textgrid>=1.6.1",
    "tqdm>=4.67.3",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "tensorboard>=2.20.0",
    "optuna>=4.8.0",
    "tempdir>=0.7.1",
    "muon-optimizer",
    "optuna-integration[pytorch-lightning]>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "pytest>=9.0.3",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130" },
]
muon-optimizer = { git = "https://github.com/KellerJordan/Muon" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
