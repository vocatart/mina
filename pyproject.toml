[project]
name = "mina"
version = "0.0.1"
description = "Mel Inter-phoneme Neural Alignment"
requires-python = ">=3.13"
dependencies = [
    "librosa==1.0.0",
    "torch==2.14.0",
    "numpy==2.5.3",
    "textgrid==1.6.1",
    "tqdm==4.70.0",
    "lightning==2.6.5",
    "matplotlib==3.11.1",
    "muon-optimizer",
    "onnx==1.22.0",
    "optuna==5.0.0",
    "lightning-utilities>=0.15.3",
    "onnxslim>=0.1.96",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
muon-optimizer = { git = "https://github.com/KellerJordan/Muon" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
